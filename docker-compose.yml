# docker-compose.yml
services:
  arrdeck:
    image: ghcr.io/odinkara/arrdeck:latest
    container_name: arrdeck
    environment:
      - PORT=8090
      - ARRDECK_CONFIG_DIR=/config
    volumes:
      - ./arrdeck-config:/config      # holds services.json (your API keys, server-side only)
    ports:
      - "8090:8090"
    restart: unless-stopped
