# Build the ArrDeck web image and publish it to GHCR.
#
# WHY THIS EXISTS: before this workflow there was no path at all from a git push
# to a running container. The NAS stack deploys ghcr.io/odinkara/arrdeck:latest,
# but nothing ever pushed to that tag, so the registry image sat 8 weeks stale
# while main moved on. Both `docker compose pull` and `up -d --build` reported
# success and changed nothing. The stack was right; the pipeline was missing.
#
# Auth is the built-in GITHUB_TOKEN. Actions authenticates to GHCR natively, so
# there is no PAT to create, store, rotate or leak.
#
# NOTE FOR A PUBLIC REPO: making the REPO public does not make the GHCR PACKAGE
# public. That is a separate toggle on the package itself, and the first publish
# lands private.

name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/arrdeck

# Least privilege: read the code, write the package. Nothing else.
permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight build; never race two publishes to :latest.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit being built
        uses: actions/checkout@v4

      # The image must be traceable back to a commit. "What is actually running?"
      # was unanswerable before, and that is exactly how the stale deploy went
      # unnoticed, so the short SHA becomes both a tag and an OCI label.
      - name: Derive short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built in, not a PAT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The deploy target is x86_64/amd64, as is the image currently running
          # there. Building arm64 as well would roughly double build time for an
          # architecture nothing here runs; add it to this list if that changes.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          # Read these back on the NAS with:
          #   docker image inspect ghcr.io/odinkara/arrdeck:latest \
          #     --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          # Layer cache in the Actions cache, so npm ci does not re-run from
          # scratch on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}"
            echo '```'
            echo ""
            echo "Commit \`${{ steps.meta.outputs.sha }}\` — redeploy with:"
            echo '```'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "If the pull fails with an auth error, the GHCR **package** is"
            echo "still private — that is a separate toggle from repo visibility."
          } >> "$GITHUB_STEP_SUMMARY"
